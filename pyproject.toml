[project]
name = "everydl"
version = "0.1.0"
description = "Windows TUI downloader for learning yt-dlp"
requires-python = ">=3.10"
dependencies = ["yt-dlp", "textual", "pyperclip"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["downloader", "app"]
